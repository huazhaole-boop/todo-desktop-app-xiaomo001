<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>UI 预览 · 桌宠待办</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: #e8f1f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .preview-tip {
      position: fixed;
      top: 10px; left: 50%;
      transform: translateX(-50%);
      background: rgba(11, 58, 102, 0.85);
      color: #fff;
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 12px;
      z-index: 100;
    }
  </style>
</head>
<body>
  <div class="preview-tip">UI 预览版 · 数据为模拟，不保存</div>
  <div class="app">
    <header class="top">
      <div class="mascot">
        <div class="mascot-shadow"></div>
        <div class="mascot-body">
          <div class="ear ear-l"></div>
          <div class="ear ear-r"></div>
          <div class="ear-inner ear-inner-l"></div>
          <div class="ear-inner ear-inner-r"></div>
          <div class="face">
            <div class="cheek cheek-l"></div>
            <div class="cheek cheek-r"></div>
            <div class="eye" id="eye-l"><div class="pupil"></div><div class="spark"></div></div>
            <div class="eye" id="eye-r"><div class="pupil"></div><div class="spark"></div></div>
            <div class="nose"></div>
            <div class="mouth"></div>
          </div>
          <div class="collar"><div class="bell"></div></div>
          <div class="tail"></div>
          <div class="paw paw-l"></div>
          <div class="paw paw-r"></div>
        </div>
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="orb orb-4"></div>
        <div class="orb orb-5"></div>
        <div class="orb orb-6"></div>
      </div>
      <div class="clock">
        <div class="time" id="time">--:--:--</div>
        <div class="date" id="date">--月--日 周-</div>
      </div>
      <button class="btn-close" title="关闭">×</button>
    </header>

    <section class="progress">
      <div class="progress-head">
        <span class="progress-label">待办进度</span>
        <span class="progress-count" id="progress-count">1/3</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" style="width: 33%"></div>
      </div>
    </section>

    <section class="todo-list" id="todo-list">
      <div class="todo-item done">
        <div class="todo-check"></div>
        <div class="todo-text">中秋策划制作</div>
        <button class="todo-del">×</button>
      </div>
      <div class="todo-item">
        <div class="todo-check"></div>
        <div class="todo-text">月报数据整理</div>
        <button class="todo-del">×</button>
      </div>
      <div class="todo-item">
        <div class="todo-check"></div>
        <div class="todo-text">闲鱼上新选品</div>
        <button class="todo-del">×</button>
      </div>
    </section>

    <footer class="bottom">
      <button class="btn-add"><span class="plus">+</span><span>新增</span></button>
    </footer>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      document.getElementById('time').textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
      const m = now.getMonth() + 1, d = now.getDate();
      const wkMap = ['日','一','二','三','四','五','六'];
      document.getElementById('date').textContent = `${m}月${d}日 周${wkMap[now.getDay()]}`;
    }
    setInterval(updateClock, 1000); updateClock();

    function blink() {
      document.querySelectorAll('.eye').forEach(e => e.classList.add('blink'));
      setTimeout(() => document.querySelectorAll('.eye').forEach(e => e.classList.remove('blink')), 130);
      setTimeout(blink, 2500 + Math.random() * 2500);
    }
    setTimeout(blink, 1500);
  </script>
</body>
</html>
